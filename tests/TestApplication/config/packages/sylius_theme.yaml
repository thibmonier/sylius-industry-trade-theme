imports:
    # Réglages de l'application hôte simulée (US-228), importés AVANT les hooks du thème : comme une application dont le fichier se charge avant celui du thème.
    - { resource: 'a_host_app.yaml' }
    # Hooks de l'US-224 (panier, compte, pages de contenu), chargés comme le ferait l'application hôte.
    - { resource: '../../../../config/twig_hooks/cart_account.yaml' }
    # Commutateur clair/sombre (US-226), monté comme le ferait l'application hôte.
    - { resource: '../../../../config/twig_hooks/color_mode.yaml' }

twig:
    paths:
        '%kernel.project_dir%/../../../templates/hooks': TmonierSyliusIndustryTradeTheme

sylius_theme:
    sources:
        filesystem:
            directories:
                - '%kernel.project_dir%/../../..'
            scan_depth: 0

services:
    Tmonier\SyliusIndustryTradeTheme\Tests\Stub\CompanyMenuEntryListener:
        arguments: ['@request_stack']
        tags:
            - { name: kernel.event_listener, event: sylius.menu.shop.account }

    Tmonier\SyliusIndustryTradeTheme\Tests\Stub\HidePricesVoter:
        arguments: ['@request_stack']
        tags:
            - { name: security.voter }
