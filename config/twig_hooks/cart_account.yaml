# Thème Industrie & Négoce : colonne « Référence » du panier (US-224, US-228).
#
# Ce fichier ne REMPLACE aucun hookable de l'application ni du cœur : il en AJOUTE deux (clé `industry_reference`,
# priorité 350, avant le produit). Chaque gabarit n'affiche rien tant que le thème n'est pas actif sur le canal courant.
# Les pages du panier et du compte du thème sont des surcharges de gabarits du cœur sous `templates/bundles/SyliusShopBundle/` :
# elles ne s'appliquent qu'aux canaux qui utilisent le thème et ne touchent pas à la configuration des hooks, donc les réglages
# d'une application sur les hookables `items`, `coupon`, `summary`, `form` ou `account` restent les siens.
#
# Nom du thème, déclaré une seule fois : les gabarits ajoutés le comparent au thème du canal courant.
twig:
    globals:
        industry_theme_name: 'tmonier/sylius-industry-trade-theme'

sylius_twig_hooks:
    hooks:
        'sylius_shop.cart.index.content.form.sections.general.items.head':
            industry_reference:
                template: '@TmonierSyliusIndustryTradeTheme/cart/head/reference.html.twig'
                priority: 350

        'sylius_shop.cart.index.content.form.sections.general.items.body':
            industry_reference:
                template: '@TmonierSyliusIndustryTradeTheme/cart/body/reference.html.twig'
                priority: 350
