# Configuration du thème Industrie & Négoce
# Ce fichier est copié dans config/packages/ de l'application. Il n'enregistre que ce qui est nécessaire au thème :
# - le namespace Twig des gabarits ajoutés par le thème (colonne « Référence » du panier, navigation du compte, page de contenu) ;
# - l'import des deux hookables de la colonne « Référence » (config/twig_hooks/cart_account.yaml, à copier aussi) ;
# - l'import du commutateur du mode d'affichage (config/twig_hooks/color_mode.yaml, copié avec le même dossier).
# Les pages du thème sont des surcharges de gabarits : elles ne s'appliquent que sur un canal dont le `theme_name` est celui du thème
# et ne remplacent aucun réglage de hook de l'application.
imports:
    - { resource: '../twig_hooks/cart_account.yaml' }
    - { resource: '../twig_hooks/color_mode.yaml' }

# Gabarits ajoutés par le thème : namespace toujours résolu, même sur un canal sans le thème.
twig:
    paths:
        '%kernel.project_dir%/vendor/tmonier/sylius-industry-trade-theme/templates/hooks': TmonierSyliusIndustryTradeTheme

# Point d'extension du lien « Inscription » (0.3.2). Sur un canal themé, le gabarit du thème l'emporte sur celui de
# l'application : celle-ci ne peut plus y poser sa condition. L'alias ci-dessous rend la décision à l'application sans que
# le thème connaisse la règle. Par défaut le lien s'affiche, comme dans Sylius ; une application dont les inscriptions sont
# fermées alias RegistrationLinkPolicyInterface sur sa propre implémentation, dans son propre fichier de services.
services:
    Tmonier\SyliusIndustryTradeTheme\Shop\AlwaysVisibleRegistrationLink: ~

    Tmonier\SyliusIndustryTradeTheme\Shop\RegistrationLinkPolicyInterface:
        alias: Tmonier\SyliusIndustryTradeTheme\Shop\AlwaysVisibleRegistrationLink

    Tmonier\SyliusIndustryTradeTheme\Twig\RegistrationLinkExtension:
        arguments: ['@Tmonier\SyliusIndustryTradeTheme\Shop\RegistrationLinkPolicyInterface']
        tags: ['twig.extension']
