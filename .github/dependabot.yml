version: 2
updates:
    - package-ecosystem: "composer"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      reviewers:
          - "thibmonier"

    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      reviewers:
          - "thibmonier"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 10
      reviewers:
          - "thibmonier"
