# Dependency updates (weekly version watch, 2026-11-03): every ecosystem weekly, minor and patch grouped
# in one pull request, majors one by one. The demo's weekly issue lists the open pull requests of every plugin.
version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          composer-minor-and-patch:
              update-types: [minor, patch]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns: ["*"]
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          npm-minor-and-patch:
              update-types: [minor, patch]
    - package-ecosystem: npm
      directory: /tests/BlankProject
      schedule:
          interval: weekly
      # A release must be a week old before it is proposed (security updates ignore the cooldown).
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          npm-audit-minor-and-patch:
              update-types: [minor, patch]
