name: Build

# No paths-ignore on "*.md": the README is the installation procedure the blank-project job runs (US-273).
on:
    push:
        branches-ignore:
            - 'dependabot/**'
    pull_request: ~
    schedule:
        # Weekly (Monday): catches Sylius template drift between pushes (US-225).
        - cron: '17 5 * * 1'
    workflow_dispatch:
        inputs:
            skip_step:
                description: "Blank project: README step to skip, to prove the job turns red (e.g. copy-config)"
                required: false
                default: ""

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# No default token permission: every job asks for what it needs (US-209).
permissions: {}

jobs:
    tests:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.5"]
                symfony: ["^7.4"]
                sylius: ["~2.2.0", "~2.3.0"]
                database: ["mysql:8.4"]
                node: ["22.x"]

                # Sylius 2.3 needs PHP ^8.3
                exclude:
                    - sylius: "~2.3.0"
                      php: "8.2"

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@c3b108b5f3c299c55f429a8cf0ed88734d4f4979 # v4.3.1
                with:
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -
                name: Audit of the PHP dependencies
                run: composer audit --abandoned=report

            -
                name: Run static analysis
                run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

            -
                name: Check coding standard
                run: vendor/bin/ecs check

            -
                name: Run unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=unit

            -
                name: Run functional tests
                run: vendor/bin/phpunit --colors=always --testsuite=functional

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Lint Twig
                run: |
                    vendor/bin/console lint:twig templates

    # The README installation procedure, as written, in a fresh Sylius-Standard project (US-273).
    blank-project:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 40

        name: "Blank project, Sylius ${{ matrix.sylius }}"

        strategy:
            fail-fast: false
            matrix:
                sylius: ["~2.2.0", "~2.3.0"]

        services:
            mysql:
                image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
                ports: ["3306:3306"]
                options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=20

        env:
            APP_ENV: prod
            APP_DEBUG: "0"
            DATABASE_NAME: sylius_blank
            DATABASE_URL: "mysql://root@127.0.0.1:3306/sylius_blank?serverVersion=8.4.0&charset=utf8mb4"
            SYLIUS_VERSION: ${{ matrix.sylius }}
            BLANK_PROJECT_SKIP_STEP: ${{ inputs.skip_step }}

        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    path: theme
                    persist-credentials: false

            -
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
                with:
                    php-version: "8.3"
                    extensions: intl, gd, exif, pdo_mysql
                    tools: composer:v2
                    coverage: none

            -
                uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
                with:
                    node-version: "22.x"

            -
                name: Create a Sylius-Standard project (theme from this checkout, as version 0.1.99)
                run: |
                    composer create-project "sylius/sylius-standard:$SYLIUS_VERSION" app --no-install --no-scripts --no-interaction
                    cd app
                    composer require "sylius/sylius:$SYLIUS_VERSION" --no-update --no-interaction
                    # Sylius-Standard 2.2 registers FOSRestBundle without requiring it: it came through
                    # sylius/resource-bundle, which no longer requires it since 1.14 (Standard 2.3 requires it).
                    composer require "friendsofsymfony/rest-bundle:^3.7" --no-update --no-interaction
                    composer config repositories.theme '{"type": "path", "url": "../theme", "options": {"symlink": false, "versions": {"tmonier/sylius-industry-trade-theme": "0.1.99"}}}'
                    composer install --no-interaction --no-progress

            -
                name: Database and fixtures of the blank project
                working-directory: app
                env:
                    APP_ENV: dev
                run: |
                    bin/console doctrine:database:create --if-not-exists --no-interaction
                    bin/console doctrine:migrations:migrate --no-interaction
                    bin/console sylius:fixtures:load --no-interaction

            -
                name: Node dependencies of the blank project
                working-directory: app
                # yarn, as in the Sylius documentation: npm 10 crashes on the file: dependencies of Sylius-Standard.
                run: yarn install --non-interactive

            -
                name: README installation steps
                working-directory: app
                run: php ../theme/bin/blank-project-steps ../theme/README.md

            -
                name: Boot the kernel after the README steps
                working-directory: app
                run: bin/console cache:clear

            -
                name: Channel with the theme, channel without it
                working-directory: app
                run: mysql -h 127.0.0.1 -u root "$DATABASE_NAME" < ../theme/tests/BlankProject/channels.sql

            -
                name: Render assertions
                working-directory: app
                run: |
                    php -S 127.0.0.1:8080 -t public > var/log/server.log 2>&1 &
                    for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
                    bash ../theme/tests/BlankProject/assert-render.sh 8080

    # Static audit of the workflows themselves (US-209). Version and image are pinned, no network.
    zizmor:
        name: Workflow audit (zizmor)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 10
        env:
            ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: zizmor (offline)
              run: docker run --rm -v "$PWD:/work" -w /work "$ZIZMOR_IMAGE" --offline .github
